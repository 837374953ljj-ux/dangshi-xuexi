<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9e1b1b">
<title>党史学习</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { font-size:16px; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background:#f7f2ea; color:#2b2320; line-height:1.7; min-height:100vh;
  }
  .wrap { max-width:520px; margin:0 auto; padding:0 14px 60px; }
  header {
    position:sticky; top:0; z-index:10;
    background:linear-gradient(135deg,#9e1b1b,#c0392b);
    color:#fff; padding:14px 16px 12px; border-radius:0 0 18px 18px;
    box-shadow:0 2px 12px rgba(158,27,27,.25);
  }
  header .row { display:flex; align-items:center; justify-content:space-between; max-width:520px; margin:0 auto; }
  header h1 { font-size:1.15rem; font-weight:700; letter-spacing:1px; }
  header .stats { display:flex; gap:10px; font-size:.85rem; }
  header .pill { background:rgba(255,255,255,.18); border-radius:999px; padding:2px 10px; }
  .checkin { margin:14px 4px 0; background:#fff; border-radius:14px; padding:12px 14px;
    box-shadow:0 1px 4px rgba(0,0,0,.06); display:flex; align-items:center; justify-content:space-between; }
  .checkin .left .num { font-size:1.3rem; font-weight:700; color:#9e1b1b; }
  .checkin .left .lbl { font-size:.8rem; color:#8a7d72; }
  .week { display:flex; gap:6px; }
  .day { width:22px; height:22px; border-radius:50%; background:#efe9e0; display:flex; align-items:center; justify-content:center; font-size:.7rem; color:#b0a396; }
  .day.on { background:#9e1b1b; color:#fff; }
  .fact { margin:12px 4px 0; background:#fdf6e3; border:1px dashed #d9b98a; border-radius:14px;
    padding:12px 14px; font-size:.9rem; color:#6b5636; }
  .fact b { color:#9e1b1b; }
  .fact .re { float:right; color:#b08d5a; font-size:.8rem; cursor:pointer; }
  .zone { margin:16px 4px 0; background:#fff; border-radius:16px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .zone-head { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; flex-wrap:wrap; }
  .zone-head .zi { font-size:1.2rem; }
  .zone-head .zn { font-weight:700; font-size:1.02rem; }
  .zone-head .zs { margin-left:auto; font-size:.75rem; color:#a3938a; }
  .zone-head .zp { font-size:.75rem; color:#9e1b1b; font-weight:600; }
  .zone-desc { font-size:.8rem; color:#8a7d72; margin-top:2px; }
  .path { display:flex; align-items:center; margin-top:10px; }
  .node { width:46px; height:46px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:1rem; cursor:pointer; border:2px solid transparent; transition:transform .15s; }
  .node:active { transform:scale(.92); }
  .node.passed { background:#9e1b1b; color:#fff; }
  .node.current { background:#fff; border-color:#9e1b1b; color:#9e1b1b; animation:pulse 1.6s infinite; }
  .node.locked { background:#ece6de; color:#b8ab9e; cursor:default; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(158,27,27,.35);} 50%{box-shadow:0 0 0 8px rgba(158,27,27,0);} }
  .link { flex:1; height:3px; background:#ece6de; border-radius:2px; min-width:8px; }
  .link.done { background:#c0392b; }
  .ltitle { text-align:center; font-size:.72rem; color:#8a7d72; margin-top:6px; display:flex; }
  .ltitle span { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:0 2px; }
  .tools { display:flex; gap:10px; margin:16px 4px 0; }
  .tool { flex:1; background:#fff; border-radius:14px; padding:12px; text-align:center;
    font-size:.9rem; color:#5c4f45; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .tool b { color:#9e1b1b; }
  .lv-top { display:flex; align-items:center; gap:10px; margin-top:14px; }
  .back { background:none; border:none; font-size:1.4rem; color:#9e1b1b; cursor:pointer; padding:4px 8px; }
  .lv-top .t { font-weight:700; font-size:1.05rem; flex:1; }
  .lv-top .y { font-size:.8rem; color:#a3938a; }
  .card { background:#fff; border-radius:16px; padding:16px; margin-top:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  /* 六段式内容 */
  .sec { margin-top:14px; }
  .sec:first-child { margin-top:0; }
  .sec .h { font-weight:700; font-size:.9rem; color:#9e1b1b; margin-bottom:4px; }
  .sec .b { font-size:.92rem; }
  .logicbox { background:#eef2f7; border-left:4px solid #7a93b5; border-radius:8px; padding:10px 12px; font-size:.88rem; color:#4a5a70; }
  .person { font-size:.9rem; margin-bottom:8px; padding-left:10px; border-left:3px solid #e5d5c5; }
  .person b { color:#7a2a1e; }
  .keybox { background:#fdf6e3; border-left:4px solid #c0392b; border-radius:8px; padding:10px 12px; margin-top:14px; font-size:.9rem; }
  .keybox b { color:#9e1b1b; }
  .btn { display:block; width:100%; margin-top:14px; padding:13px; border:none; border-radius:12px;
    background:linear-gradient(135deg,#9e1b1b,#c0392b); color:#fff; font-size:1rem; font-weight:600;
    cursor:pointer; letter-spacing:2px; }
  .btn.ghost { background:#efe9e0; color:#6b5d50; letter-spacing:0; }
  .btn:active { transform:scale(.98); }
  .qtag { font-size:.78rem; color:#a3938a; margin-bottom:6px; }
  .qtag .review { color:#b08d5a; font-weight:600; }
  .q { font-weight:600; font-size:1rem; margin-bottom:12px; }
  .opt { display:block; width:100%; text-align:left; background:#f7f2ea; border:2px solid transparent;
    border-radius:12px; padding:12px 14px; margin-bottom:10px; font-size:.92rem; cursor:pointer; }
  .opt.right { background:#e8f5e9; border-color:#43a047; color:#1b5e20; }
  .opt.wrong { background:#fdecea; border-color:#e53935; color:#b71c1c; }
  .opt.dim { opacity:.5; }
  .hint { font-size:.85rem; background:#fff8e1; border-radius:8px; padding:8px 10px; margin-top:4px; color:#7a6a3f; }
  .prog { display:flex; gap:6px; margin:10px 0 2px; }
  .prog i { flex:1; height:4px; border-radius:2px; background:#ece6de; }
  .prog i.on { background:#c0392b; }
  .big { text-align:center; font-size:2.6rem; margin:6px 0; }
  .stars { text-align:center; font-size:1.6rem; letter-spacing:6px; }
  .center { text-align:center; }
  .muted { color:#8a7d72; font-size:.85rem; }
  .toast { position:fixed; left:50%; bottom:60px; transform:translateX(-50%);
    background:#2b2320; color:#fff; padding:10px 18px; border-radius:999px; font-size:.88rem;
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:99; max-width:86vw; text-align:center; }
  .toast.show { opacity:1; }
  .wrong-item { background:#fff; border-radius:12px; padding:12px 14px; margin:10px 4px 0; box-shadow:0 1px 4px rgba(0,0,0,.06); font-size:.9rem; }
  .wrong-item .a { color:#1b5e20; font-weight:600; }
  .footer { text-align:center; margin-top:24px; font-size:.75rem; color:#b0a396; }
  .footer a { color:#b0a396; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 数据：7大关区 × 5关，六段式内容 ================= */
const ZONES = [
{ id:1, icon:"🚩", name:"建党与大革命", span:"1919–1927",
  desc:"从五四觉醒到南湖建党，从国共合作到大革命失败——党在血与火中诞生并上了第一课。",
  levels:[
  { title:"五四运动", year:"1919",
    logic:"起点：旧中国积贫积弱、思想禁锢 → 五四运动唤醒民众、传播马克思主义 → 为两年后建党准备了思想和干部。",
    bg:"辛亥革命后北洋军阀统治黑暗，军阀混战、民不聊生。一战期间民族工业短暂发展，工人阶级壮大到200多万人。1915年起的新文化运动以《新青年》为阵地猛批旧思想，1917年俄国十月革命又给中国送来马克思主义——思想火种已经埋下，只等一个导火索。",
    story:"1919年，一战结束后的巴黎和会上，列强把德国在山东的权益转让给日本，而中国作为战胜国却毫无话语权。消息传回国内，5月4日，北京学生走上街头游行示威，喊出「外争主权，内除国贼」，要求拒签不平等和约。6月起，上海工人大规模罢工声援，运动从北京扩展到全国，工人阶级第一次以独立的政治力量登上历史舞台。最终中国代表拒绝在和约上签字。",
    meaning:"五四运动是一场彻底的反帝反封建的爱国运动，是中国新民主主义革命的开端。它促进了马克思主义在中国的传播并与工人运动相结合，为中国共产党的成立作了思想上和干部上的准备。",
    people:[
      {n:"陈独秀",d:"新文化运动旗手、《新青年》创办人，五四运动的精神领袖之一，后来成为党的主要创始人和早期领导人。"},
      {n:"李大钊",d:"中国最早系统传播马克思主义的人，写下《我的马克思主义观》。「南陈北李，相约建党」说的就是他陈独秀。"}
    ],
    key:"五四运动是中国新民主主义革命的开端，为中国共产党成立作了思想和干部上的准备。",
    quiz:[
      { q:"五四运动爆发的直接导火索是？", o:["巴黎和会上中国外交的失败","俄国十月革命的爆发","《辛丑条约》的签订","日本发动九一八事变"], a:0, h:"1919年巴黎和会，列强把山东权益转给日本。" },
      { q:"五四运动中学生喊出的著名口号是？", o:["打倒列强，除军阀","外争主权，内除国贼","停止内战，一致抗日","自己动手，丰衣足食"], a:1, h:"「外争主权」指向列强，「内除国贼」指向卖国官员。" },
      { q:"1919年6月后，五四运动的中心从北京转移到了哪座城市？", o:["广州","武汉","上海","天津"], a:2, h:"6月起上海工人罢工，运动中心随之转移。" },
      { q:"五四运动为中国共产党的成立准备了什么？", o:["军事和经济基础","思想上和干部上的准备","统一的军队","成熟的外交经验"], a:1, h:"马克思主义传播并与工人运动结合，培养了一批先进分子。" }
    ]},
  { title:"南湖红船：中共一大", year:"1921",
    logic:"五四运动传播了马克思主义、锻炼了先进分子 → 各地共产党早期组织相继建立 → 一大召开，中国共产党正式诞生。",
    bg:"五四运动后，马克思主义广泛传播。1920年起，陈独秀在上海、李大钊在北京，毛泽东在长沙、董必武在武汉等地先后建立共产党早期组织（时称共产主义小组），共产国际也派代表来华协助。建立全国统一的无产阶级政党的条件已经成熟。",
    story:"1921年7月23日，上海法租界望志路106号的一幢石库门房子里，13名代表秘密聚会，代表着全国50多名党员——中国共产党第一次全国代表大会开幕。会议进行到7月30日晚，一名陌生男子闯入会场，代表们警觉转移，最后一天会议改在浙江嘉兴南湖的一艘游船上进行。就在这条小船上，大会通过了党的第一个纲领，正式宣告中国共产党诞生。这条小船后来被称为「红船」。",
    meaning:"中国共产党的成立是开天辟地的大事变。自从有了中国共产党，中国革命就有了坚强的领导核心和科学的指导思想，中国革命的面貌焕然一新。红船所承载的首创精神、奋斗精神、奉献精神，被称为「红船精神」。",
    people:[

      {n:"董必武",d:"武汉代表。13名一大代表中，最终只有他和毛泽东两人走上天安门参加开国大典——其他人或牺牲、或脱党、或叛变，革命之路大浪淘沙。"}
    ],
    key:"1921年中共一大召开，中国共产党成立，这是中国历史上开天辟地的大事变。",
    quiz:[
      { q:"中共一大最初在哪里召开？", o:["北京","上海","嘉兴","广州"], a:1, h:"最初在上海法租界的一幢石库门房子里。" },
      { q:"因会场被巡捕房注意，一大最后一天会议转移到哪里继续？", o:["杭州西湖的画舫","嘉兴南湖的游船","南京的旅馆","苏州的园林"], a:1, h:"嘉兴南湖的一条游船，即著名的「红船」。" },
      { q:"出席中共一大的代表共有多少人？", o:["7人","13人","21人","50人"], a:1, h:"13名代表，代表全国50多名党员。" },
      { q:"13名一大代表中，后来登上天安门参加开国大典的是？", o:["毛泽东、董必武","陈独秀、李大钊","张国焘、李达","何叔衡、邓恩铭"], a:0, h:"其余代表或牺牲、或脱党、或叛变，革命大浪淘沙。" }
    ]},
  { title:"第一次国共合作", year:"1924",
    logic:"建党后工人运动屡遭镇压，党认识到需要同盟军 → 国共合作建立革命统一战线 → 大革命高潮兴起、北伐展开。",
    bg:"中国共产党成立后集中力量领导工人运动，但1923年京汉铁路工人大罢工遭军阀血腥镇压（二七惨案），血的教训表明：单靠工人阶级孤军奋战无法战胜强大的敌人，必须建立广泛的统一战线。与此同时，孙中山领导的革命屡战屡败，也迫切寻找新的力量和出路，在共产国际推动下，国共两党走向合作。",
    story:"1924年1月，中国国民党第一次全国代表大会在广州召开，孙中山确立了「联俄、联共、扶助农工」三大政策，共产党员可以以个人身份加入国民党——第一次国共合作正式形成。同年，在苏联和中国共产党帮助下，黄埔军校在广州创办，孙中山兼任总理，蒋介石任校长，周恩来任政治部主任。国共合作推动了工农运动空前高涨，大革命的洪流滚滚而来。",
    meaning:"第一次国共合作建立了革命统一战线，掀起了以北伐为标志的大革命高潮，沉重打击了帝国主义和封建军阀势力；黄埔军校培养了大批军事政治骨干，许多人后来成为国共两党的重要将领。",
    people:[
      {n:"孙中山",d:"伟大的革命先行者。晚年改组国民党、实行三大政策，他说「联俄联共」是让革命「起死回生」的良方。1925年3月病逝，留下「革命尚未成功，同志仍须努力」。"},
      {n:"周恩来",d:"26岁出任黄埔军校政治部主任，把政治工作做得有声有色，深受师生敬重。"}
    ],
    key:"1924年国民党一大召开，标志第一次国共合作正式形成，大革命由此兴起。",
    quiz:[
      { q:"第一次国共合作正式形成的标志是？", o:["中共一大召开","国民党一大召开","北伐战争开始","黄埔军校成立"], a:1, h:"1924年1月，广州，国民党一大。" },
      { q:"孙中山在国民党一大上确立的三大政策是？", o:["民族、民权、民生","联俄、联共、扶助农工","联美、抗日、建国","平均地权、节制资本、耕者有其田"], a:1, h:"联俄、联共、扶助农工。" },
      { q:"黄埔军校的政治部主任是哪位共产党人？", o:["毛泽东","周恩来","朱德","叶挺"], a:1, h:"周恩来26岁出任黄埔军校政治部主任。" },
      { q:"二七惨案的教训促使中国共产党认识到？", o:["必须放弃工人运动","必须建立革命统一战线、联合同盟军","必须立即武装暴动","必须退往农村"], a:1, h:"单靠工人阶级孤军奋战无法战胜强大敌人。" }
    ]},
  { title:"北伐战争", year:"1926",

    bg:"国共合作后，广东革命根据地通过两次东征得到统一和巩固，广州国民政府站稳了脚跟；五卅运动和省港大罢工使工农运动空前高涨，为北伐提供了深厚的群众基础。而北洋军阀连年混战、横征暴敛，早已民心尽失。打倒军阀、统一中国的时机成熟了。",
    story:"1926年7月，国民革命军从广州誓师北伐，目标是打倒吴佩孚、孙传芳、张作霖三派军阀，「打倒列强，除军阀」的歌声响彻南北。共产党员叶挺率领的独立团作为先遣队，在汀泗桥、贺胜桥等战役中屡战屡胜，为第四军赢得「铁军」称号。北伐军不到半年就从珠江流域打到长江流域，上海工人先后三次举行武装起义予以配合。就在胜利在望之时，暗流也在涌动。",
    meaning:"北伐战争基本动摇了北洋军阀的反动统治，是国共合作的重大成果；工农群众运动迅猛发展，中国共产党在斗争中积累了武装斗争和群众工作的宝贵经验，党员从不足千人发展到近六万人。",
    people:[
      {n:"叶挺",d:"北伐名将，率独立团为先锋连克强敌，为第四军赢得「铁军」威名。后来领导南昌起义、广州起义，皖南事变中被扣押，狱中写下著名的《囚歌》。"}
    ],
    key:"1926年北伐战争胜利进军，基本动摇了北洋军阀统治，是国共合作的重大成果。",
    quiz:[

    bg:"北伐的胜利进军动摇了帝国主义和大地主大资产阶级的利益，他们加紧拉拢革命阵营内部动摇分子。蒋介石在北伐中掌握了军权、势力膨胀，与共产党的矛盾日益尖锐。而党内陈独秀推行右倾妥协退让，放弃革命领导权，对国民党右派的进攻一再退让，使党和人民在屠刀落下时缺少防备。",
    story:"1927年4月12日，蒋介石在上海发动反革命政变，指使军队和青帮流氓大肆搜捕、屠杀共产党员和革命群众，三天内300多人被杀、500多人被捕。7月15日，汪精卫在武汉召开「分共」会议，同样举起屠刀，叫嚣「宁可枉杀千人，不可使一人漏网」。轰轰烈烈的第一次国共合作全面破裂，大革命失败，党员从近6万人锐减到1万多人。",

    people:[

    meaning:"遵义会议集中解决了当时最紧迫的军事和组织问题，事实上确立了毛泽东在党中央和红军的领导地位，在最危急的关头挽救了党、挽救了红军、挽救了中国革命。它是党的历史上一个生死攸关的转折点，标志着中国共产党开始独立自主解决中国革命的实际问题，从幼年走向成熟。",

  { title:"长征胜利", year:"1936",
    logic:"遵义会议确立正确领导 → 红军四渡赤水、翻雪山过草地 → 三大主力会师，长征胜利，革命大本营落脚陕北。",
    bg:"遵义会议后，红军在毛泽东指挥下四渡赤水、巧渡金沙江，跳出数十万敌军的围追堵截。但长征路上不仅有敌人的堵截，还有内部的考验——1935年6月红一、四方面军会师后，张国焘自持兵多，拒不执行北上方针，甚至企图分裂党和红军，党中央果断率红一、三军团先行北上。而陕北已有刘志丹领导的根据地，成为长征的最终落脚点。",
    story:"红军一路强渡大渡河，22名勇士冒着枪林弹雨攀着铁索飞夺泸定桥；翻越终年积雪的夹金山等40多座雪山，穿越遍布沼泽的茫茫草地，野菜草根充饥、皮带皮鞋煮汤。1935年10月中央红军到达陕北吴起镇；1936年10月，红一、二、四方面军在甘肃会宁胜利会师，长征宣告结束。两年间红军纵横十余省、长驱二万五千里，经历大小战斗600余次。",

    people:[

    logic:"抗战胜利后人民渴望和平 → 毛泽东亲赴重庆争取和平、揭露假和平阴谋 → 国民党撕毁协定，内战不可避免地到来。",
    bg:"抗战胜利后，全国人民渴望和平建国。但蒋介石坚持独裁内战方针，只是他的军队大多远在西南、西北大后方，立即发动全面内战尚有困难，还需要时间调兵遣将。于是他连发三封电报邀请毛泽东赴重庆谈判，料定毛不敢来，好把内战责任推给共产党；如果来，则可借此拖延时间部署兵力。美国则推行「扶蒋反共」政策，帮助国民党运兵抢占战略要地。",
    story:"1945年8月28日，毛泽东以「弥天大勇」飞赴重庆，周恩来、王若飞同行。消息传出，山城轰动，诗人柳亚子盛赞这一举动。谈判历时43天，国共双方围绕军队国家化、解放区政权等焦点激烈交锋。10月10日，双方签署《政府与中共代表会谈纪要》，即《双十协定》，国民党被迫承认和平建国的基本方针。毛泽东在重庆发表词作《沁园春·雪》，「数风流人物，还看今朝」震动国统区文化界。",
    meaning:"重庆谈判表明了中国共产党争取和平民主的真诚愿望，在政治上赢得了主动，教育了全国人民。《双十协定》的签订使共产党的主张深入人心。而当国民党后来撕毁协定发动内战时，全国人民看清了谁要和平、谁要战争，人心向背就此分明。",
    people:[
      {n:"毛泽东",d:"置个人安危于度外亲赴重庆。临行前他在党内说：去了可以给和平一个机会，不去就正中国民党下怀。"},
      {n:"张治中",d:"国民党谈判代表，真诚希望和平，把自家官邸桂园让给毛泽东办公居住，被称为「和平将军」。"}
    ],
    key:"1945年重庆谈判签署《双十协定》，共产党用行动表明了争取和平民主的诚意。",
    quiz:[

  { title:"千里跃进大别山", year:"1947",
    logic:"国民党撕毁协定发动内战，解放军粉碎其全面进攻和重点进攻 → 党中央果断把战争引向国统区 → 刘邓大军跃进大别山，战略反攻开始。",
    bg:"1946年6月，国民党撕毁《双十协定》和停战协定，以进攻中原解放区为起点发动全面内战。战争第一年，解放军采取集中优势兵力、各个歼灭敌人的战法，先后粉碎了国民党的全面进攻和对陕北、山东的重点进攻，歼敌70多万。但战场始终在老解放区，人力物力消耗巨大。中共中央审时度势，果断决定：不等完全粉碎敌人进攻，立即把战争引向国民党统治区。",
    story:"1947年6月30日，刘伯承、邓小平率晋冀鲁豫野战军主力12万人在鲁西南强渡黄河，揭开战略进攻序幕。随后部队甩开围追堵截，横跨陇海铁路，涉过黄泛区的污泥积水，千里跃进，于8月末直插大别山——这里东慑南京、西逼武汉，像一把尖刀插入国民党统治的心脏。与此同时，陈粟大军挺进豫皖苏、陈谢兵团挺进豫西，三路大军在中原呈「品」字形展开。",
    meaning:"千里跃进大别山揭开了人民解放军战略进攻的序幕，实现了从战略防御到战略进攻的历史性转变，是解放战争的转折点。毛泽东评价：这是蒋介石二十年反革命统治由发展到消灭的转折点，是一百多年来帝国主义在中国的统治由发展到消灭的转折点。",
    people:[
      {n:"刘伯承、邓小平",d:"「刘邓大军」从此威名远扬。涉黄泛区时重装备全部丢下，刘伯承说「狭路相逢勇者胜」，硬是闯出一条血路。"}
    ],
    key:"1947年刘邓大军千里跃进大别山，揭开人民解放军战略进攻的序幕。",
    quiz:[
      { q:"千里跃进大别山的部队由谁率领？", o:["刘伯承、邓小平","陈毅、粟裕","林彪、罗荣桓","彭德怀、习仲勋"], a:0, h:"「刘邓大军」由此闻名。" },
      { q:"全面内战爆发的标志是？", o:["国民党进攻中原解放区","重庆谈判破裂","双十协定签订","占领延安"], a:0, h:"1946年6月，国民党撕毁协定发动内战。" },
      { q:"千里跃进大别山的战略意义是？", o:["揭开战略进攻的序幕","标志长征开始","宣告抗战胜利","完成三大战役"], a:0, h:"解放军由战略防御转入战略进攻。" },
      { q:"这一行动发生在哪一年？", o:["1945年","1946年","1947年","1949年"], a:2, h:"1947年6月强渡黄河。" }
    ]},
  { title:"三大战役", year:"1948",
    logic:"战略进攻使敌我力量对比根本变化 → 党中央抓住决战时机 → 辽沈、淮海、平津三大战役基本消灭国民党主力。",
    bg:"到1948年秋，解放军发展到280万人，士气高昂、装备改善，解放区土改完成、后方巩固；国民党军队则士气低落，被迫龟缩在沈阳、北平、徐州等少数孤立据点实行「重点防御」，且内部矛盾重重、经济崩溃、民心尽失。敌我力量对比发生根本变化，战略决战的时机成熟了。国统区还形成了反蒋的「第二条战线」，学生市民反饥饿反内战运动风起云涌。",
    story:"1948年9月至1949年1月，三大战役接连打响。辽沈战役「关门打狗」攻克锦州，解放东北全境；淮海战役中，543万支前民工推小车、挑担子随军转战，陈毅动情地说：淮海战役的胜利，是人民群众用小车推出来的；平津战役先取天津、再逼北平，傅作义率部起义，千年古都和平解放。三大战役历时142天，歼灭和改编国民党军队150多万人。",
    meaning:"三大战役基本消灭了国民党赖以维持反动统治的主要军事力量，为人民解放军渡江作战、解放全中国奠定了决定性基础。这是人民战争的伟大胜利——兵民是胜利之本，人民群众的支持是胜利的根本保证。",
    people:[
      {n:"粟裕",d:"最早向中央建议举行淮海战役，指挥华东野战军连战连捷。毛泽东说淮海战役粟裕立了第一功。"},
      {n:"支前民工",d:"543万民工、88万辆小推车、20万副担架——淮海战场背后是人类战争史上罕见的支前奇观。"}
    ],
    key:"辽沈、淮海、平津三大战役歼敌150余万，国民党主力基本被消灭，奠定全国胜利基础。",
    quiz:[

      { q:"陈毅说哪场战役的胜利是「人民群众用小车推出来的」？", o:["辽沈战役","淮海战役","平津战役","孟良崮战役"], a:1, h:"543万支前民工支援淮海前线。" },
      { q:"北平和平解放归功于？", o:["傅作义率部起义","和平谈判破裂","天津守军投降","美军调停"], a:0, h:"平津战役中，千年古都免于战火。" },
      { q:"三大战役共歼灭和改编国民党军队约多少人？", o:["50万","100万","150多万","300万"], a:2, h:"142天内歼敌150多万。" }

  { title:"渡江战役", year:"1949",
    logic:"三大战役后国民党假和谈拖延时间 → 和谈破裂，百万雄师过大江 → 南京解放，国民党反动统治覆灭。",
    bg:"三大战役后，国民党长江以北主力丧失殆尽，蒋介石宣布「下野」，由李宗仁出任代总统，一面在长江布防，一面提出和谈，企图「划江而治」、赢得喘息时间卷土重来。1949年4月，国共双方在北平举行和平谈判，中共代表团提出以八项条件为基础的和平协定。4月20日，国民党政府拒绝在协定上签字，假和平的面具彻底揭穿。",
    story:"1949年4月21日，毛泽东、朱德发布《向全国进军的命令》。百万解放军在西起湖口、东至江阴的千里战线上分三路强渡长江，木帆船对钢铁军舰，万船齐发、直指南岸。14岁的支前船工马毛姐六次横渡长江运送解放军，手臂中弹仍坚持掌舵。4月23日，人民解放军占领南京，总统府门楼上的青天白日旗被扯下——国民党22年反动统治覆灭。",
    meaning:"渡江战役的胜利彻底粉碎了国民党「划江而治」的图谋，宣告了国民党在大陆反动统治的覆灭，为解放全中国、建立新中国扫清了最大障碍。毛泽东写下《七律·人民解放军占领南京》：「宜将剩勇追穷寇，不可沽名学霸王」——将革命进行到底的决心跃然纸上。",
    people:[
      {n:"马毛姐",d:"安徽无为的14岁渔家女孩，渡江战役中六次横渡长江运送解放军，是「渡江英雄」中年龄最小的一位，2021年获颁「七一勋章」。"}
    ],
    key:"1949年4月23日南京解放，宣告国民党在大陆22年反动统治覆灭。",
    quiz:[
      { q:"人民解放军占领南京、推翻国民党反动统治的日期是？", o:["1949年1月31日","1949年4月23日","1949年10月1日","1949年12月10日"], a:1, h:"渡江战役打响后第三天。" },
      { q:"「宜将剩勇追穷寇，不可沽名学霸王」出自？", o:["朱德的诗","毛泽东《七律·人民解放军占领南京》","陈毅的词","周恩来的题词"], a:1, h:"毛泽东为南京解放所作。" },
      { q:"渡江战役前国共北平谈判破裂的原因是？", o:["共产党拒绝和谈","国民党政府拒绝在和平协定上签字","美国中止调停","苏联出面反对"], a:1, h:"国民党假和谈真备战，图谋「划江而治」。" },
      { q:"南京的解放宣告了统治中国多少年的国民党政权覆灭？", o:["10年","15年","22年","38年"], a:2, h:"1927年南京国民政府成立，至1949年共22年。" }
    ]},
  { title:"开国大典", year:"1949",
    logic:"解放战争全国胜利在即 → 新政协筹备建国、通过《共同纲领》 → 开国大典举行，中华人民共和国成立，中国历史开启新纪元。",
    bg:"渡江战役后，解放军继续向全国进军，大陆基本解放，建立新中国的条件成熟了。1949年9月，中国人民政治协商会议第一届全体会议在北平召开，中国共产党、各民主党派、无党派人士、人民团体等662名代表共商国是。会议通过具有临时宪法作用的《中国人民政治协商会议共同纲领》，决定国都、国旗、国歌、纪年，选举产生中央人民政府委员会——新中国的一切准备就绪。",
    story:"1949年10月1日下午3时，北京天安门广场30万军民齐聚。毛泽东登上天安门城楼，向全世界庄严宣告：「中华人民共和国中央人民政府今天成立了！」54门礼炮齐鸣28响——28响象征中国共产党从1921年成立起领导人民奋斗的28年。第一面五星红旗冉冉升起。阅兵式上受阅飞机只有17架，周恩来安排其中9架掉头再飞一遍。如今，这盛世已如所愿，飞机再也不用飞两遍了。",
    meaning:"中华人民共和国的成立，结束了帝国主义、封建主义和官僚资本主义统治中国的历史，结束了半殖民地半封建社会，人民成为国家的主人，实现了民族独立和人民解放。中国历史从此进入新纪元，中华民族走上了实现伟大复兴的壮阔道路。",
    people:[
      {n:"宋庆龄",d:"孙中山夫人。她欣然接受中国共产党邀请北上参加新政协，当选中央人民政府副主席，见证了丈夫未竟理想的实现。"},
      {n:"曾联松",d:"五星红旗的设计者，浙江瑞安一位普通经济工作者。他的设计从近3000件应征图案中脱颖而出。"}
    ],
    key:"1949年10月1日开国大典标志新中国成立，结束了半殖民地半封建社会，人民当家作主。",
    quiz:[

      { q:"中华人民共和国成立的日期是？", o:["1949年7月1日","1949年8月15日","1949年10月1日","1950年1月1日"], a:2, h:"下午3时，天安门广场。" },

    ]}

  levels:[
  { title:"抗美援朝", year:"1950",
    logic:"新中国刚成立、百废待兴 → 战火烧到鸭绿江边 → 抗美援朝保家卫国，立国之战打出和平环境。",
    bg:"新中国成立之初百废待兴：经济凋敝、土匪未清、台湾未解放。1950年6月朝鲜内战爆发，美国立即武装干涉，并派第七舰队侵入台湾海峡。9月美军在仁川登陆后越过三八线直逼中朝边境，美军飞机多次轰炸中国东北边境城乡。应朝鲜党和政府请求，中共中央经过艰难抉择，作出抗美援朝、保家卫国的历史性决策。",

  { title:"一五计划与三大改造", year:"1953",
    logic:"政权巩固、经济恢复 → 过渡时期总路线提出 → 一五计划奠定工业化基础，三大改造确立社会主义制度。",
    bg:"到1952年底，土地改革基本完成，国民经济全面恢复，开展大规模建设的条件具备了。但新中国工业基础一穷二白——毛泽东感慨：我们能造桌子椅子、茶碗茶壶，能种粮食磨成面粉，但是一辆汽车、一架飞机、一辆坦克、一辆拖拉机都不能造。1953年，党提出过渡时期总路线：实现社会主义工业化，对农业、手工业和资本主义工商业进行社会主义改造，即「一化三改」。",
    story:"1953年起，第一个五年计划实施，集中主要力量发展重工业，苏联援建的156项重点工程成为骨干。建设者们以空前的热情投身工业化：鞍钢工人孟泰把捡回的零件装满一间仓库，建起著名的「孟泰仓库」。1956年，长春第一汽车制造厂造出第一辆国产「解放牌」汽车；1957年，武汉长江大桥建成通车，「一桥飞架南北，天堑变通途」。到1957年底，一五计划各项指标大幅超额完成。到1956年底，三大改造基本完成。",
    meaning:"一五计划的超额完成使我国开始改变工业落后面貌，为社会主义工业化奠定了初步基础。1956年底三大改造基本完成，实现了生产资料私有制向社会主义公有制的转变，社会主义基本制度在我国建立起来——这是中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了制度基础。",
    people:[

  { title:"两弹一星", year:"1964",
    logic:"社会主义制度确立后探索建设道路 → 面对核讹诈和封锁，自力更生攻坚国防尖端 → 两弹一星撑起大国脊梁。",
    bg:"上世纪五六十年代，新生的共和国面临严峻的国际环境：美国多次对中国进行核威胁核讹诈，1959年6月苏联单方面撕毁协定、撤走全部援华专家，带走图纸资料，断言中国二十年也搞不出原子弹。党中央果断决策：独立自主、自力更生，勒紧裤腰带也要把「两弹一星」搞出来。第一颗原子弹因此代号「596」，铭记1959年6月这个耻辱时刻。",
    story:"钱学森冲破美国五年的软禁阻挠回国投身导弹事业；邓稼先告别妻儿隐姓埋名28年，把名字从所有公开出版物上抹去；于敏放弃已有的学术前途转入氢弹理论，名字绝密28年。1964年10月16日，罗布泊腾空升起蘑菇云，中国第一颗原子弹爆炸成功；1967年6月，第一颗氢弹空爆成功，从原子弹到氢弹中国只用了两年八个月，世界最快；1970年4月24日，「东方红一号」卫星升空，《东方红》乐曲响彻太空。",
    meaning:"「两弹一星」打破了超级大国的核垄断和核讹诈，大大增强了我国的国防实力和国际地位，带动了科技事业的整体跃升。它所孕育的「热爱祖国、无私奉献，自力更生、艰苦奋斗，大力协同、勇于登攀」的两弹一星精神，是中华民族的宝贵精神财富。",
    people:[
      {n:"钱学森",d:"被美国软禁五年仍执意归国，美国海军次长说「他一个人抵得上五个师」。回国后成为中国导弹航天事业奠基人。"},
      {n:"邓稼先",d:"隐姓埋名28年扎根戈壁。临终前他说：假如生命终结后可以再生，我仍选择中国，选择核事业。"},
      {n:"郭永怀",d:"力学家。1968年飞机失事，搜救人员发现他和警卫员紧紧抱在一起，用身体护住了完好无损的绝密资料。"}

  { title:"重返联合国", year:"1971",

    bg:"新中国是联合国创始会员国和安理会常任理事国，但1949年后中国在联合国的合法席位长期被台湾当局占据，美国操纵表决机器一再阻挠恢复新中国的合法权利。随着中国国际地位提高，特别是大批亚非拉新独立国家加入联合国，支持中国的力量逐年壮大，美国的阻挠越来越难以为继。",
    story:"1971年10月25日，第26届联合国大会就「恢复中华人民共和国在联合国的一切合法权利」的第2758号决议进行表决。当电子计票牌定格在76票赞成、35票反对、17票弃权时，会场沸腾了，许多亚非拉国家代表起身欢呼、击掌跳舞。台湾当局的代表被立即驱逐。中国代表团团长乔冠华在联合国讲坛上仰头开怀大笑的照片，成为20世纪外交史上的经典瞬间。毛泽东风趣地说：是非洲兄弟把我们抬进联合国的。",

  { title:"真理标准大讨论", year:"1978",
    logic:"文革结束后「两个凡是」束缚思想、工作徘徊 → 真理标准大讨论冲破禁区 → 思想解放为伟大转折扫清道路。",
    bg:"1976年10月「四人帮」被粉碎，十年文革结束，举国欢庆。但1977年提出的「两个凡是」——凡是毛主席作出的决策都坚决维护，凡是毛主席的指示都始终不渝地遵循——实质上是要延续过去的错误，使拨乱反正寸步难行，党和国家工作在徘徊中前进。中国向何处去，首先需要回答一个根本问题：判断是非的标准到底是什么？",
    story:"1978年5月11日，《光明日报》以特约评论员名义发表《实践是检验真理的唯一标准》，新华社当天转发，次日《人民日报》《解放军报》全文转载。文章鲜明指出：检验真理的标准只能是社会实践，任何理论都要不断接受实践的检验。文章一石激起千层浪，遭到「两个凡是」坚持者的压制，但得到邓小平等老一辈革命家的坚决支持，一场全国性的真理标准问题大讨论由此展开，思想禁区被冲破。",
    meaning:"这场大讨论是一场深刻的思想解放运动，冲破了「两个凡是」的束缚，重新确立了实事求是的思想路线，为党的十一届三中全会的召开作了重要的思想准备，成为改革开放的思想先导。它告诉全党：思想僵化，一切从本本出发，党和国家就会失去生机。",
    people:[
      {n:"胡耀邦",d:"时任中央党校副校长，组织和推动了文章的发表与讨论的展开，是这场思想解放运动的重要推动者。"},
      {n:"邓小平",d:"旗帜鲜明支持大讨论，批评「两个凡是」不符合马克思主义，倡导解放思想、实事求是。"}
    ],
    key:"1978年真理标准大讨论确立「实践是检验真理的唯一标准」，为十一届三中全会作了思想准备。",
    quiz:[

      { q:"「两个凡是」的实质是？", o:["坚持实事求是","延续过去的错误、束缚拨乱反正","维护安定团结","推进改革开放"], a:1, h:"它使党和国家工作在徘徊中前进。" },
      { q:"《实践是检验真理的唯一标准》一文首发于？", o:["《人民日报》","《光明日报》","《解放军报》","《红旗》杂志"], a:1, h:"1978年5月11日，以特约评论员名义发表。" },
      { q:"这场大讨论的历史作用是？", o:["为十一届三中全会和改革开放作了思想准备","标志新中国成立","启动一五计划","恢复联合国席位"], a:0, h:"思想解放是社会变革的先导。" }
    ]}
]},

  { title:"小岗村的红手印", year:"1978",
    logic:"三中全会吹响改革号角 → 改革率先在农村取得突破 → 小岗村的红手印点燃家庭联产承包责任制的燎原之火。",
    bg:"文革结束时，全国农村还有1.5亿人没有解决温饱，旧的管理体制束缚了农民的生产积极性。1978年安徽遭遇百年不遇的大旱，省委作出「借地种麦」的松动政策。就在十一届三中全会开幕前夕，凤阳县小岗村的农民们也在密谋一件「惊天动地」的大事。中国改革的突破口，为什么在农村？因为农民最穷，穷则思变。",
    story:"1978年冬一个夜晚，小岗村18户农民挤在一间破茅草屋里，在一张皱巴巴的包干契约上按下鲜红的手印：「我们分田到户，每户户主签字盖章……如不成，我们干部坐牢杀头也甘心，大家保证把我们的小孩养活到18岁。」冒着坐牢风险搞起的包产到户，第二年就让小岗村粮食产量相当于1966年到1970年五年的总和，第一次向国家交了公粮。党中央尊重农民首创精神，家庭联产承包责任制逐步推向全国。",
    meaning:"小岗村的红手印拉开了中国农村改革的序幕。家庭联产承包责任制把土地经营权交给农民，极大解放和发展了农村生产力，迅速解决了人民温饱问题。它证明：改革要尊重群众的首创精神——人民群众是历史的创造者，也是中国改革的真正主角。",

    logic:"农村改革初见成效 → 对外开放迈开步伐 → 经济特区杀出一条血路，成为改革开放的窗口和试验田。",
    bg:"三中全会后，对外开放提上日程。1979年，广东省委向中央提出利用毗邻港澳的优势办出口加工区的设想，邓小平欣然支持，说出那句名言：「还是叫特区好……中央没有钱，可以给些政策，你们自己去搞，杀出一条血路来。」借鉴国外自由贸易区的经验，同时利用侨乡优势吸引外资和技术，兴办经济特区的决策就此形成。",

    meaning:"经济特区成为中国对外开放的窗口、经济体制改革的试验田，为全国改革开放和现代化建设积累了宝贵经验、发挥了示范作用。1984年中央进而开放14个沿海港口城市，对外开放由点到面逐步铺开。深圳奇迹雄辩地证明：改革开放是决定当代中国命运的关键一招。",

  { title:"港澳回归", year:"1997",
    logic:"改革开放使国力大增 → 「一国两制」伟大构想破解历史遗留难题 → 香港、澳门相继回归，洗雪百年国耻。",

    story:"为实现祖国和平统一，邓小平创造性提出「一国两制」：在一个中国的前提下，国家主体坚持社会主义制度，港澳台保持原有资本主义制度长期不变。1982年邓小平会见撒切尔夫人时掷地有声：主权问题不是一个可以讨论的问题。经过中英、中葡谈判，1984年、1987年分别签署联合声明。1997年7月1日零时，五星红旗在香港升起，历经156年沧桑的香港回归祖国；1999年12月20日，澳门也回到祖国怀抱。",
    meaning:"港澳回归洗雪了中华民族百年国耻，是「一国两制」由科学构想变为成功实践的伟大创举，标志着祖国统一大业迈出重要一步，也为国际社会以和平方式解决历史遗留问题提供了新思路。",
    people:[

  { title:"入世与奥运", year:"2001",
    logic:"改革开放持续深化、国力跃升 → 加入世贸、举办奥运 → 中国深度融入世界，以更加自信的姿态走向世界舞台中央。",

    story:"2001年12月11日，中国正式加入世界贸易组织，对外开放进入新阶段，「中国制造」加速走向全球，世界也分享中国市场的红利。2008年8月8日晚8时，第29届奥运会在北京鸟巢开幕，29个焰火脚印沿北京中轴线走向鸟巢，「同一个世界，同一个梦想」响彻全球。204个国家和地区的运动员参赛，中国代表团首次登上金牌榜首位。从1908年「奥运三问」到2008年梦圆，整整一百年。",
    meaning:"加入世贸组织是中国对外开放的重要里程碑，标志着对外开放进入全方位、多层次、宽领域的新阶段；北京奥运会的成功举办展示了中国的综合国力和开放自信。这两件大事共同见证：改革开放使中国大踏步赶上了时代，中华民族迎来了从站起来、富起来到强起来的伟大飞跃的前奏。",

    bg:"改革开放以来经济长期高速增长，但也付出了资源环境代价：一些地方水污染、空气污染、土壤污染问题突出，2013年前后大范围雾霾频发，「先污染后治理」的老路难以为继。发展为了什么？如果金山银山要以绿水青山为代价，这样的发展就不是人民想要的发展。发展方式的转型势在必行。",

    meaning:"「两山」理念深刻揭示了经济发展与生态环境保护的辩证统一关系，成为习近平生态文明思想的核心要义。在这一理念指引下，污染防治攻坚战成效显著，美丽中国建设迈出重大步伐，绿水青山正在成为人民群众触手可及的金山银山。",

/* ================= 学习数据上报（党史学习 v1.0.0） =================
   多人分享学习时，把每个人的学习数据上报到后端服务。
   部署时把 ENDPOINT 改为你的数据接口地址即可；为空则仅本机记录。 */
const SYNC = {
  ENDPOINT: "",          // 例：https://你的后端服务/collect
  VERSION: "1.0.0"
};
function report(event, payload){
  const data = {
    app:"党史学习", version:SYNC.VERSION, event,
    uid:S.uid, user:S.user||"", time:new Date().toISOString(),
    streak:S.streak, stars:totalStars(), passed:Object.keys(S.passed).length,
    ...payload
  };
  if(!SYNC.ENDPOINT) return; // 未配置后端时跳过
  try{
    const body=JSON.stringify(data);
    if(navigator.sendBeacon){ navigator.sendBeacon(SYNC.ENDPOINT, new Blob([body],{type:"application/json"})); }
    else{ fetch(SYNC.ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body,keepalive:true}).catch(()=>{}); }
  }catch(e){}
}

/* ================= 答题 ================= */
function pickReview(zi,li){
  const passedIds=Object.keys(S.passed).filter(id=>id!==zi+"-"+li);
  if(!passedIds.length) return null;
  const id=passedIds[Math.floor(Math.random()*passedIds.length)];
  const [a,b]=id.split("-").map(Number);
  const lv=ZONES[a].levels[b];
  const q=lv.quiz[Math.floor(Math.random()*lv.quiz.length)];
  return {q, from:lv.title};
}

function startQuiz(zi,li){
  const review = pickReview(zi,li);
  VIEW={name:"quiz",zi,li,review,idx:0,correct:0,qs:ZONES[zi].levels[li].quiz.map(q=>({...q})),answered:false};
  renderQuestion();
}

function renderQuestion(){
  const V=VIEW, lv=ZONES[V.zi].levels[V.li];
  const isReview = V.review && V.idx===0;
  const item = isReview? V.review.q : V.qs[V.idx - (V.review?1:0)];
  const total = V.qs.length + (V.review?1:0);
  const dots = Array.from({length:total},(_,i)=>`<i class="${i<V.idx?"on":""}"></i>`).join("");
  const tag = isReview
    ? `<span class="review">⚡ 回马枪复习题</span>（来自「${V.review.from}」，不计入过关）`
    : `第 ${V.idx-(V.review?1:0)+1} / ${V.qs.length} 题 · 答对3题即过关`;
  const opts = item.o.map((o,i)=>`<button class="opt" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("");
  app.innerHTML = renderHeader() + `<div class="wrap">
    <div class="lv-top"><button class="back" onclick="render()">‹</button>
      <div class="t">${lv.title} · 闯关</div><div class="y">${lv.year}</div></div>
    <div class="card">
      <div class="prog">${dots}</div>
      <div class="qtag">${tag}</div>
      <div class="q">${item.q}</div>
      <div id="opts">${opts}</div>
      <div id="fb"></div>
    </div>
  </div>`;
  window.scrollTo(0,0);
}

function answer(i){
  const V=VIEW;
  if(V.answered) return;
  V.answered=true;
  const isReview = V.review && V.idx===0;
  const item = isReview? V.review.q : V.qs[V.idx-(V.review?1:0)];
  const right = i===item.a;
  if(right) V.correct++;
  const optEls=document.querySelectorAll("#opts .opt");
  optEls.forEach((el,j)=>{
    if(j===item.a) el.classList.add("right");
    else if(j===i) el.classList.add("wrong");
    else el.classList.add("dim");
  });
  if(!right){
    addWrong(item);
    document.getElementById("fb").innerHTML =
      `<div class="hint">💡 ${item.h}<br>正确答案：${String.fromCharCode(65+item.a)}. ${item.o[item.a]}</div>`;
  }
  setTimeout(()=>{
    V.idx++; V.answered=false;
    const total = V.qs.length + (V.review?1:0);
    if(V.idx<total) renderQuestion();
    else finishQuiz();
  }, right?700:2600);
}

function addWrong(item){
  if(S.wrong.some(w=>w.q===item.q)) return;
  S.wrong.unshift({q:item.q, a:item.o[item.a], h:item.h, day:todayStr()});
  if(S.wrong.length>60) S.wrong.length=60;
  save();
}

function finishQuiz(){
  const V=VIEW, id=V.zi+"-"+V.li, lv=ZONES[V.zi].levels[V.li];
  const need=3, pass = V.correct>=need; // 复习题不计入过关要求
  const stars = pass? (V.correct>=4?3:2) : 0;
  let checkinMsg="";
  if(pass){
    const prev=S.passed[id];
    if(!prev || prev.stars<stars) S.passed[id]={stars, day:todayStr()};
    const t=todayStr();
    if(S.lastDay!==t){
      S.streak = (S.lastDay===yesterdayStr())? S.streak+1 : 1;
      S.lastDay=t;
      S.days=S.days||{}; S.days[t]=true;
      checkinMsg = `📅 今日打卡成功！连续 ${S.streak} 天`;
      if([3,7,15,30,60,100].includes(S.streak)) checkinMsg = `🏅 里程碑！已连续打卡 ${S.streak} 天，太稳了！`;
    }
    save();
    report("level_passed",{level:id, title:lv.title, stars, correct:V.correct, total:V.qs.length});
    if(checkinMsg) report("checkin",{day:S.lastDay, milestone:[3,7,15,30,60,100].includes(S.streak)});
  }
  const nid=nextId();
  const starStr = pass? "★".repeat(stars)+"☆".repeat(3-stars) : "";
  app.innerHTML = renderHeader() + `<div class="wrap">
    <div class="card center">
      <div class="big">${pass?"🎉":"💪"}</div>
      <h2 style="font-size:1.2rem">${pass?"闯关成功！":"差一点点"}</h2>
      ${pass?`<div class="stars">${starStr}</div>`:""}
      <div class="muted" style="margin-top:6px">${V.qs.length} 题答对 ${V.correct} 题${V.review?"（复习题不计入）":""}</div>
      ${pass?`<div class="keybox" style="text-align:left"><b>再记一遍</b>｜${lv.key}</div>`:`<div class="hint" style="margin-top:10px">答对 3 题才能过关。回头再读一遍故事，答案都藏在里面。</div>`}
    </div>
    ${pass && nid? `<button class="btn" onclick="openNext()">继续下一关 ›</button>`:""}
    ${!pass? `<button class="btn" onclick="openLevel(${V.zi},${V.li})">重新挑战本关</button>`:""}
    <button class="btn ghost" onclick="render()">返回地图</button>
  </div>`;
  if(checkinMsg) toast(checkinMsg);
  window.scrollTo(0,0);
}

function openNext(){
  const nid=nextId();
  if(nid===null){ render(); return; }
  const [a,b]=nid.split("-").map(Number);
  openLevel(a,b);
}

/* ================= 错题本 ================= */
function openWrong(){
  const items = S.wrong.length
    ? S.wrong.map(w=>`<div class="wrong-item"><div>${w.q}</div><div class="a">✓ ${w.a}</div><div class="muted">${w.h}</div></div>`).join("")
    : `<div class="card center muted" style="margin-top:14px">还没有错题，保持住！</div>`;
  app.innerHTML = renderHeader() + `<div class="wrap">
    <div class="lv-top"><button class="back" onclick="render()">‹</button><div class="t">📕 错题本</div></div>
    <div class="muted" style="margin-top:8px">答错的题会自动收进来，闯关前翻一翻，记得最牢。</div>
    ${items}
    ${S.wrong.length?`<button class="btn ghost" onclick="clearWrong()">清空错题本</button>`:""}
  </div>`;
  window.scrollTo(0,0);
}
function clearWrong(){ if(confirm("确定清空错题本？")){ S.wrong=[]; save(); openWrong(); } }

function resetAll(){
  if(confirm("确定清除全部进度重新开始？打卡记录也会清空。")){
    S={passed:{},streak:0,lastDay:"",days:{},wrong:[]};
    save(); render();
  }
}

function render(){ VIEW={name:"home"}; renderHome(); }
render();
</script>
</body>
</html>
